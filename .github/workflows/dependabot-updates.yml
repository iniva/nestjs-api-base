name: Dependabot Updates

# This event is triggered on pushes to main
on:
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  DEPENDABOT_BRANCH: dependabot-updates

jobs:
  sync:
    name: Sync dependabot-updates with main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout main
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "${{ github.event.pusher.email || 'github-actions[bot]@users.noreply.github.com' }}"
          git config user.name  "${{ github.event.pusher.name || 'github-actions[bot]' }}"

      - name: Check if branch exists
        id: check
        run: |
          if git ls-remote --exit-code origin refs/heads/${{ env.DEPENDABOT_BRANCH }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create branch from main
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "Creating '${{ env.DEPENDABOT_BRANCH }}' branch"
          git checkout -b ${{ env.DEPENDABOT_BRANCH }}
          git push origin ${{ env.DEPENDABOT_BRANCH }}

      - name: Rebase onto main
        if: steps.check.outputs.exists == 'true'
        run: |
          git checkout ${{ env.DEPENDABOT_BRANCH }}

          if git rebase -X ours origin/main; then
            echo "Rebase successful"
          else
            echo "Rebase failed, aborting and resetting to origin/main"
            git rebase --abort
            git reset --hard origin/main
          fi

          git push --force-with-lease origin ${{ env.DEPENDABOT_BRANCH }}
